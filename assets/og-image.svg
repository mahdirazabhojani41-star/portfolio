<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="og-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="60%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#08090B"/>
    </linearGradient>
    <pattern id="og-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(245, 222, 54, 0.06)"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#og-grad)"/>
  <rect width="1200" height="630" fill="url(#og-pattern)"/>

  <!-- Yellow Accent Glow -->
  <circle cx="1050" cy="150" r="300" fill="rgba(245, 222, 54, 0.08)" filter="blur(80px)"/>
  <circle cx="150" cy="500" r="250" fill="rgba(245, 222, 54, 0.05)" filter="blur(70px)"/>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Content -->
  <g transform="translate(100, 140)">
    <!-- Location Badge -->
    <rect x="0" y="0" width="280" height="36" rx="8" fill="rgba(245, 222, 54, 0.12)" stroke="rgba(245, 222, 54, 0.3)" stroke-width="1"/>
    <text x="14" y="23" fill="#F5DE36" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">📍 AHMEDABAD, GUJARAT, INDIA</text>

    <!-- Main Title -->
    <text x="0" y="110" fill="#F4F5F7" font-family="'Big Shoulders Display', sans-serif" font-size="76" font-weight="900" letter-spacing="2">MAHEDI RAZA BHOJANI</text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="170" fill="#F5DE36" font-family="'Big Shoulders Display', sans-serif" font-size="34" font-weight="700" letter-spacing="1">DEVELOPER • AI/ML LEARNER • FITNESS COACH</text>
    
    <text x="0" y="225" fill="#9FA6B2" font-family="'DM Sans', sans-serif" font-size="20">
      Student developer building AI-powered computer vision tools like RepRight.
    </text>
    <text x="0" y="258" fill="#9FA6B2" font-family="'DM Sans', sans-serif" font-size="20">
      Combining gym discipline, progressive overload, and machine learning.
    </text>

    <!-- Featured Badge -->
    <g transform="translate(0, 310)">
      <rect width="440" height="60" rx="12" fill="#141720" stroke="rgba(245, 222, 54, 0.4)" stroke-width="1.5"/>
      <circle cx="32" cy="30" r="12" fill="#F5DE36"/>
      <path d="M28 30L31 33L37 27" stroke="#0B0C0E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="36" fill="#F4F5F7" font-family="'DM Sans', sans-serif" font-size="16" font-weight="700">
        Featured Build: <tspan fill="#F5DE36">RepRight AI Squat Coach</tspan>
      </text>
    </g>
  </g>
</svg>

