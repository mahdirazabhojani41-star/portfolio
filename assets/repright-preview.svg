<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="50%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#090A0D"/>
    </linearGradient>

    <!-- Glow Filter for Landmarks -->
    <filter id="yellow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Rubber Gym Floor Pattern -->
    <pattern id="gym-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
      <circle cx="15" cy="15" r="1" fill="rgba(255,255,255,0.035)"/>
    </pattern>
  </defs>

  <!-- Viewport Base -->
  <rect width="960" height="540" fill="url(#bg-grad)"/>
  <rect width="960" height="540" fill="url(#gym-grid)"/>

  <!-- Camera Vignette & Gym Silhouette Ambiance -->
  <circle cx="480" cy="270" r="420" fill="none" stroke="rgba(245, 222, 54, 0.03)" stroke-width="80"/>

  <!-- Viewfinder Frame Brackets -->
  <g stroke="#F5DE36" stroke-width="2.5" opacity="0.8">
    <!-- Top Left -->
    <path d="M 40 70 L 40 40 L 70 40"/>
    <!-- Top Right -->
    <path d="M 890 40 L 920 40 L 920 70"/>
    <!-- Bottom Left -->
    <path d="M 40 470 L 40 500 L 70 500"/>
    <!-- Bottom Right -->
    <path d="M 890 500 L 920 500 L 920 470"/>
    <!-- Center Reticle -->
    <circle cx="480" cy="270" r="18" fill="none" stroke="rgba(245,222,54,0.3)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 470 270 H 490 M 480 260 V 280" stroke="rgba(245,222,54,0.4)" stroke-width="1.5"/>
  </g>

  <!-- Gym Background Elements (Squat Rack Silhouette) -->
  <g opacity="0.15" stroke="#F4F5F7" stroke-width="3">
    <!-- Vertical Uprights -->
    <line x1="330" y1="90" x2="330" y2="480"/>
    <line x1="630" y1="90" x2="630" y2="480"/>
    <!-- Pegs on rack -->
    <line x1="324" y1="160" x2="336" y2="160"/>
    <line x1="324" y1="220" x2="336" y2="220"/>
    <line x1="324" y1="280" x2="336" y2="280"/>
    <line x1="324" y1="340" x2="336" y2="340"/>
    <line x1="624" y1="160" x2="636" y2="160"/>
    <line x1="624" y1="220" x2="636" y2="220"/>
    <line x1="624" y1="280" x2="636" y2="280"/>
    <line x1="624" y1="340" x2="636" y2="340"/>
    <!-- Pullup Bar -->
    <line x1="310" y1="110" x2="650" y2="110"/>
  </g>

  <!-- POSE DETECTION SKELETON (Squat Depth Representation) -->
  <!-- Subtle Body Mesh / Silhouette -->
  <path d="M480 185 C460 215 440 260 440 310 C440 350 455 370 480 370 C505 370 520 350 520 310 C520 260 500 215 480 185 Z" fill="rgba(245, 222, 54, 0.04)"/>
  
  <!-- Barbell across traps -->
  <g filter="url(#yellow-glow)">
    <line x1="340" y1="218" x2="620" y2="218" stroke="#F5DE36" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Plates on ends -->
    <rect x="336" y="195" width="12" height="46" rx="3" fill="#F5DE36"/>
    <rect x="320" y="202" width="12" height="32" rx="2" fill="#F5DE36" opacity="0.8"/>
    <rect x="612" y="195" width="12" height="46" rx="3" fill="#F5DE36"/>
    <rect x="628" y="202" width="12" height="32" rx="2" fill="#F5DE36" opacity="0.8"/>
  </g>

  <!-- Landmark Bones / Connections -->
  <g stroke="rgba(255, 255, 255, 0.55)" stroke-width="2.5" stroke-linecap="round">
    <!-- Spine / Torso -->
    <line x1="480" y1="175" x2="480" y2="220"/>
    <!-- Shoulders -->
    <line x1="435" y1="225" x2="525" y2="225"/>
    <!-- Left Arm -->
    <line x1="435" y1="225" x2="410" y2="218"/>
    <line x1="410" y1="218" x2="425" y2="210"/>
    <!-- Right Arm -->
    <line x1="525" y1="225" x2="550" y2="218"/>
    <line x1="550" y1="218" x2="535" y2="210"/>
    <!-- Torso to Hips -->
    <line x1="435" y1="225" x2="450" y2="330"/>
    <line x1="525" y1="225" x2="510" y2="330"/>
    <line x1="450" y1="330" x2="510" y2="330"/>
    
    <!-- LEGS IN DEEP SQUAT (Active Tracking Highlight) -->
    <!-- Left Leg (Thigh: Hip -> Knee) -->
    <line x1="450" y1="330" x2="385" y2="340" stroke="#00E5FF" stroke-width="3.5" filter="url(#cyan-glow)"/>
    <!-- Left Leg (Shin: Knee -> Ankle) -->
    <line x1="385" y1="340" x2="420" y2="450" stroke="#00E5FF" stroke-width="3.5" filter="url(#cyan-glow)"/>
    <!-- Left Foot -->
    <line x1="420" y1="450" x2="390" y2="455" stroke="#00E5FF" stroke-width="3"/>

    <!-- Right Leg (Thigh: Hip -> Knee) -->
    <line x1="510" y1="330" x2="575" y2="340" stroke="#F5DE36" stroke-width="3.5" filter="url(#yellow-glow)"/>
    <!-- Right Leg (Shin: Knee -> Ankle) -->
    <line x1="575" y1="340" x2="540" y2="450" stroke="#F5DE36" stroke-width="3.5" filter="url(#yellow-glow)"/>
    <!-- Right Foot -->
    <line x1="540" y1="450" x2="570" y2="455" stroke="#F5DE36" stroke-width="3"/>
  </g>

  <!-- Landmark Nodes (Joint Dots) -->
  <g filter="url(#yellow-glow)">
    <!-- Head / Face -->
    <circle cx="480" cy="172" r="14" fill="#141720" stroke="#F5DE36" stroke-width="2"/>
    <circle cx="480" cy="172" r="4" fill="#F5DE36"/>
    <!-- Shoulders -->
    <circle cx="435" cy="225" r="5" fill="#F5DE36"/>
    <circle cx="525" cy="225" r="5" fill="#F5DE36"/>
    <!-- Elbows & Wrists -->
    <circle cx="410" cy="218" r="4" fill="#F4F5F7"/>
    <circle cx="425" cy="210" r="3.5" fill="#F4F5F7"/>
    <circle cx="550" cy="218" r="4" fill="#F4F5F7"/>
    <circle cx="535" cy="210" r="3.5" fill="#F4F5F7"/>
    <!-- Hips -->
    <circle cx="450" cy="330" r="6" fill="#00E5FF"/>
    <circle cx="510" cy="330" r="6" fill="#F5DE36"/>
    <!-- Knees (Key Angle Nodes) -->
    <circle cx="385" cy="340" r="7" fill="#00E5FF"/>
    <circle cx="575" cy="340" r="7" fill="#F5DE36"/>
    <!-- Ankles -->
    <circle cx="420" cy="450" r="5" fill="#00E5FF"/>
    <circle cx="540" cy="450" r="5" fill="#F5DE36"/>
  </g>

  <!-- Angle Measurement Arc on Right Knee -->
  <path d="M 548 340 A 28 28 0 0 1 562 375" fill="none" stroke="#F5DE36" stroke-width="2.5" stroke-dasharray="3 2"/>
  <rect x="585" y="325" width="82" height="28" rx="6" fill="#14161A" stroke="#F5DE36" stroke-width="1.5"/>
  <text x="626" y="344" fill="#F5DE36" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">88° HIP</text>

  <!-- TOP HUD BAR -->
  <rect x="40" y="35" width="880" height="42" rx="10" fill="rgba(14, 16, 21, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Status Indicator -->
  <circle cx="65" cy="56" r="5" fill="#EF4444">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="60" fill="#F4F5F7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1">LIVE AI VISION</text>
  <text x="210" y="60" fill="rgba(255,255,255,0.4)" font-family="'JetBrains Mono', monospace" font-size="12">|</text>
  <text x="225" y="60" fill="#9FA6B2" font-family="'JetBrains Mono', monospace" font-size="12">MEDIAPIPE POSE 33-PTS</text>
  <!-- FPS & Target -->
  <rect x="740" y="44" width="70" height="24" rx="4" fill="rgba(245,222,54,0.15)"/>
  <text x="775" y="60" fill="#F5DE36" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">60 FPS</text>
  <text x="830" y="60" fill="#9FA6B2" font-family="'JetBrains Mono', monospace" font-size="12">LATENCY: 14ms</text>

  <!-- OVERLAY CARD: REP COUNTER (LEFT) -->
  <g transform="translate(60, 110)">
    <rect width="210" height="135" rx="14" fill="rgba(20, 22, 26, 0.92)" stroke="rgba(245, 222, 54, 0.3)" stroke-width="1.5"/>
    <text x="20" y="32" fill="#9FA6B2" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5">REPS COMPLETED</text>
    <text x="20" y="86" fill="#F4F5F7" font-family="'Big Shoulders Display', sans-serif" font-size="58" font-weight="900">08</text>
    <text x="86" y="86" fill="#68707D" font-family="'Big Shoulders Display', sans-serif" font-size="34" font-weight="700">/ 10</text>
    <rect x="20" y="100" width="170" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="20" y="100" width="136" height="8" rx="4" fill="#F5DE36"/>
    <circle cx="156" cy="104" r="5" fill="#F5DE36" filter="url(#yellow-glow)"/>
  </g>

  <!-- OVERLAY CARD: FORM FEEDBACK (RIGHT) -->
  <g transform="translate(690, 110)">
    <rect width="210" height="165" rx="14" fill="rgba(20, 22, 26, 0.92)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="20" y="32" fill="#9FA6B2" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5">FORM DIAGNOSTIC</text>
    
    <!-- Status Pill -->
    <rect x="20" y="46" width="170" height="30" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1"/>
    <circle cx="34" cy="61" r="4" fill="#10B981"/>
    <text x="46" y="66" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">DEPTH: VALID (88°)</text>

    <!-- Metrics -->
    <text x="20" y="106" fill="#F4F5F7" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600">Torso Alignment</text>
    <text x="190" y="106" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="end">OPTIMAL</text>
    <line x1="20" y1="116" x2="190" y2="116" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <text x="20" y="136" fill="#F4F5F7" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600">Knee Symmetry</text>
    <text x="190" y="136" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="end">BALANCED</text>
    <line x1="20" y1="146" x2="190" y2="146" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- BOTTOM COACHING PROMPT BUBBLE -->
  <g transform="translate(240, 460)">
    <rect width="480" height="46" rx="23" fill="rgba(20, 22, 26, 0.95)" stroke="#F5DE36" stroke-width="1.5" filter="url(#yellow-glow)"/>
    <!-- Audio Wave / Speaker Icon -->
    <g transform="translate(24, 15)" fill="#F5DE36">
      <path d="M1 5V11H5L10 16V0L5 5H1Z"/>
      <path d="M12 4C13.2 5.2 14 7 14 8C14 9 13.2 10.8 12 12" stroke="#F5DE36" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>
    <text x="52" y="28" fill="#F4F5F7" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500">
      <tspan font-weight="700" fill="#F5DE36">AI COACH: </tspan>"Flawless depth on rep 8. Drive upward through the heels!"
    </text>
  </g>
</svg>

