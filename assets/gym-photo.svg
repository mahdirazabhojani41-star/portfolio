<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="photo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22"/>
      <stop offset="60%" stop-color="#101216"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </linearGradient>
    <pattern id="gym-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="rgba(245, 222, 54, 0.08)"/>
    </pattern>
  </defs>

  <rect width="600" height="700" rx="20" fill="url(#photo-grad)"/>
  <rect width="600" height="700" rx="20" fill="url(#gym-pattern)"/>
  
  <!-- Subtle Border glow -->
  <rect x="2" y="2" width="596" height="696" rx="18" fill="none" stroke="rgba(245, 222, 54, 0.25)" stroke-width="2"/>

  <!-- Athletic Geometric Background Accent -->
  <path d="M 50 650 L 550 150" stroke="rgba(245, 222, 54, 0.06)" stroke-width="90"/>
  <circle cx="480" cy="180" r="140" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="40"/>

  <!-- Center Graphic: Barbell & Cricket Fusion Badge -->
  <g transform="translate(300, 290)">
    <!-- Barbell Plate Silhouette -->
    <circle cx="0" cy="0" r="110" fill="#141720" stroke="#F5DE36" stroke-width="4" stroke-dasharray="16 8"/>
    <circle cx="0" cy="0" r="75" fill="#0E1015" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="#181B22" stroke="#F5DE36" stroke-width="3"/>
    
    <!-- Crossed Cricket Bats in Background -->
    <g stroke="#9FA6B2" stroke-width="4" stroke-linecap="round" opacity="0.65">
      <line x1="-80" y1="-80" x2="80" y2="80"/>
      <line x1="80" y1="-80" x2="-80" y2="80"/>
    </g>

    <!-- Cricket Ball Accent -->
    <circle cx="55" cy="-45" r="16" fill="#DC2626" stroke="#F4F5F7" stroke-width="1.5"/>
    <path d="M 43 -45 Q 55 -52 67 -45" stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-dasharray="2 2"/>
    
    <!-- Dumbbell / Iron Icon -->
    <g fill="#F5DE36" transform="translate(-24, -12)">
      <rect x="0" y="8" width="48" height="8" rx="2"/>
      <rect x="6" y="0" width="6" height="24" rx="2"/>
      <rect x="36" y="0" width="6" height="24" rx="2"/>
    </g>
  </g>

  <!-- Typography Banner at Bottom -->
  <g transform="translate(60, 480)">
    <rect width="480" height="150" rx="14" fill="rgba(14, 16, 21, 0.88)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <!-- Tag Pill -->
    <rect x="25" y="24" width="130" height="26" rx="6" fill="rgba(245, 222, 54, 0.15)"/>
    <text x="90" y="41" fill="#F5DE36" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">ATHLETIC DRIVE</text>
    
    <text x="25" y="82" fill="#F4F5F7" font-family="'Big Shoulders Display', sans-serif" font-size="28" font-weight="800" letter-spacing="1">IRON DISCIPLINE &amp; CRICKET</text>
    <text x="25" y="112" fill="#9FA6B2" font-family="'DM Sans', sans-serif" font-size="13">Ahmedabad, Gujarat • Personal photo slot (replace with your image)</text>
  </g>
</svg>

